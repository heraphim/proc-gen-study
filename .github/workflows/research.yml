name: Research the next subjects

# Asks every model there is a key for about whichever subjects are furthest behind, compares their
# answers mechanically, and proposes the result as a pull request.
#
# Nightly, because the constraint is not how fast findings can be produced but how fast a person
# can read them. The run stops when it has spent half of any provider's daily free allowance, so
# it never consumes the whole quota -- see --budget-fraction in scripts/research.js.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'How many subjects this run researches'
        required: false
        default: '10'
      debug:
        description: 'Print every raw model reply'
        type: boolean
        default: false
      providers:
        description: 'Seats to use, comma separated (default: every seat with a key)'
        required: false
      budget_fraction:
        description: 'Share of each daily allowance this run may spend'
        required: false
        default: '0.5'
      dry_run:
        description: 'Research and report without recording anything'
        type: boolean
        default: false
      list_models:
        description: 'Only ask each provider which models it serves, then stop'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # A queue of unread findings is worse than none: it makes the catalogue look reviewed when
      # it is only proposed. Stop producing while the reading is behind.
      - name: Stop if the open pull request is already long
        id: backlog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending=$(gh pr view research/nightly --json commits --jq '.commits | length' 2>/dev/null || echo 0)
          # gh can also exit 0 with empty output; [ "" -ge 7 ] would abort the whole run.
          case "$pending" in (''|*[!0-9]*) pending=0;; esac
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          if [ "$pending" -ge 7 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$pending unreviewed nights already open. Skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Code from main, data from the open branch.
      #
      # Continuing the branch wholesale was wrong: it carried the scripts too, so once a night
      # had run, every later night re-ran that night's code. A fix pushed to main would never
      # execute, and the run would report the old behaviour while the repository showed the new.
      # That happened, and the only reason it was noticed is that a log message still had its
      # old wording.
      #
      # Findings not yet merged still need to accumulate in one reviewable pull request, so the
      # annotation files -- and only those -- are carried forward.
      - name: Start from main, keeping any unmerged findings
        if: steps.backlog.outputs.skip == 'false'
        run: |
          git checkout -B research/nightly origin/main
          if git ls-remote --exit-code --heads origin research/nightly >/dev/null 2>&1; then
            git checkout origin/research/nightly -- \
              data/annotations/reviews.json data/annotations/further-reading.json \
              data/annotations/algorithms.json data/annotations/corrections.json 2>/dev/null || true
            git diff --cached --quiet || echo "carried forward unmerged findings from research/nightly"
          fi

      # The database is derived and not committed, and concept display names resolve through it
      # (tag names live in the source HTML). Without this the prompts would ask about slugs.
      - name: Build the database
        if: steps.backlog.outputs.skip == 'false' && github.event.inputs.list_models != 'true'
        run: npm run migrate

      - name: Which models does each provider actually serve?
        if: github.event.inputs.list_models == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/research.js --list-models

      - name: Ask the models
        if: steps.backlog.outputs.skip == 'false' && github.event.inputs.list_models != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Via env, not ${{ }} inside the script — expansion happens before the shell sees the
          # text, so an interpolated dispatch input would be spliced into the command verbatim.
          PROVIDERS_INPUT: ${{ github.event.inputs.providers }}
        run: |
          node scripts/research.js \
            --budget-fraction '${{ github.event.inputs.budget_fraction || 0.5 }}' \
            --count '${{ github.event.inputs.count || 10 }}' \
            ${PROVIDERS_INPUT:+--providers "$PROVIDERS_INPUT"} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            ${{ github.event.inputs.debug == 'true' && '--debug' || '' }} \
            --markdown research-report.md

      # Without this a dry run has nowhere to put its findings: no pull request is opened, so the
      # report is written on the runner and thrown away with it. The answers are the point of the
      # run, and they were only visible by scrolling the log.
      - name: Keep the report
        if: always() && steps.backlog.outputs.skip == 'false' && github.event.inputs.list_models != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: research-report
          path: research-report.md
          if-no-files-found: warn

      # The gate. A run that produced something the migration rejects proposes nothing: the
      # fairness invariant, the round contiguity and the link rules all fail here first.
      # The build runs too — a bot PR never triggers validate.yml (events created with the
      # workflow's own GITHUB_TOKEN start no further workflows), so this is its only build check.
      - name: Validate
        if: steps.backlog.outputs.skip == 'false' && github.event.inputs.list_models != 'true'
        run: |
          npm run migrate
          npm run check-samples
          npm run check-register
          npm run check-guards
          npm run build

      - name: Anything to propose?
        if: steps.backlog.outputs.skip == 'false' && github.event.inputs.list_models != 'true'
        id: check
        run: |
          if git diff --quiet -- data/annotations/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing recorded this run."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the pull request
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Everything a run may touch. Listing only the review files silently dropped the
          # catalogue edits and their correction rows -- the run made them, the migration passed
          # them, and the commit left them behind.
          git add data/annotations/reviews.json data/annotations/further-reading.json \
                  data/annotations/algorithms.json data/annotations/corrections.json
          git commit -m "Research round: $(date -u +%Y-%m-%d)"
          git push --force-with-lease origin research/nightly

          if [ -z "$(gh pr list --head research/nightly --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head research/nightly \
              --title 'Three-model review of the next subjects' \
              --body-file research-report.md
          else
            # Each night appends a commit; the body shows the latest run and the diff carries
            # everything not yet merged.
            gh pr comment research/nightly --body-file research-report.md
          fi
