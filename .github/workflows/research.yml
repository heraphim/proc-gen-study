name: Research the next subjects

# Asks three models from three labs about whichever subjects are furthest behind, compares their
# answers mechanically, and proposes the result as a pull request.
#
# Nightly, because the constraint is not how fast findings can be produced but how fast a person
# can read them. The run stops when it has spent half of any provider's daily free allowance, so
# it never consumes the whole quota -- see --budget-fraction in scripts/research.js.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'How many subjects (default: as many as half the daily budget affords)'
        required: false
      budget_fraction:
        description: 'Share of each daily allowance this run may spend'
        required: false
        default: '0.5'
      dry_run:
        description: 'Research and report without recording anything'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # A queue of unread findings is worse than none: it makes the catalogue look reviewed when
      # it is only proposed. Stop producing while the reading is behind.
      - name: Stop if the open pull request is already long
        id: backlog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending=$(gh pr view research/nightly --json commits --jq '.commits | length' 2>/dev/null || echo 0)
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          if [ "$pending" -ge 7 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$pending unreviewed nights already open. Skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Continue the open branch if there is one, so a night's work adds to a single reviewable
      # pull request rather than opening a new one and conflicting on the same annotation files.
      - name: Continue the open branch, or start from main
        if: steps.backlog.outputs.skip == 'false'
        run: |
          if git ls-remote --exit-code --heads origin research/nightly >/dev/null 2>&1; then
            git checkout -B research/nightly origin/research/nightly
          else
            git checkout -B research/nightly origin/main
          fi

      - name: Ask the three models
        if: steps.backlog.outputs.skip == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          node scripts/research.js \
            --budget-fraction '${{ github.event.inputs.budget_fraction || 0.5 }}' \
            ${{ github.event.inputs.count && format('--count {0}', github.event.inputs.count) || '' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            --markdown research-report.md

      # The gate. A run that produced something the migration rejects proposes nothing: the
      # fairness invariant, the round contiguity and the link rules all fail here first.
      - name: Validate
        if: steps.backlog.outputs.skip == 'false'
        run: |
          npm run migrate
          npm run check-samples
          npm run check-register
          npm run check-guards

      - name: Anything to propose?
        if: steps.backlog.outputs.skip == 'false'
        id: check
        run: |
          if git diff --quiet -- data/annotations/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing recorded this run."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the pull request
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/annotations/reviews.json data/annotations/further-reading.json
          git commit -m "Research round: $(date -u +%Y-%m-%d)"
          git push --force-with-lease origin research/nightly

          if [ -z "$(gh pr list --head research/nightly --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head research/nightly \
              --title 'Three-model review of the next subjects' \
              --body-file research-report.md
          else
            # Each night appends a commit; the body shows the latest run and the diff carries
            # everything not yet merged.
            gh pr comment research/nightly --body-file research-report.md
          fi
